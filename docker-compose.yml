services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: recipe_ledger
      POSTGRES_PASSWORD: recipe_ledger
      POSTGRES_DB: recipe_ledger
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
